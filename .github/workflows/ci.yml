name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typescript:
    name: TypeScript Checks (Lint, Typecheck, Build, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Workspace
        run: pnpm lint

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Build
        run: pnpm build

      - name: Run Tests
        run: pnpm test

  python:
    name: Python Checks (Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.28"

      - name: Sync Dependencies
        run: uv sync --all-packages

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Mypy Typecheck
        run: uv run mypy --explicit-package-bases .

      - name: Run Pytest
        run: uv run pytest apps/api && uv run pytest apps/worker
